name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

# A new push to a branch supersedes in-flight runs for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.7
  RUFF_VERSION: 0.16.0

jobs:
  flutter:
    name: Flutter (format, analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test bin

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # `flutter test` defaults to the GitHub Actions reporter here, which
      # annotates failures inline on the pull request.
      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  backend:
    name: Backend (lint, format, compile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/ruff-action@v3
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check --output-format=github
          src: backend

      - name: Check formatting
        uses: astral-sh/ruff-action@v3
        with:
          version: ${{ env.RUFF_VERSION }}
          args: format --check --diff
          src: backend

      - name: Byte-compile
        run: python -m compileall -q backend
